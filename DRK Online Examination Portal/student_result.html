<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Exam Result</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Exam Result</h1>
    <div class="student-result" id="resultBox"></div>
    <div style="text-align: center; margin-top: 2rem;">
      <a href="index.html"><button>Back to Home</button></a>
    </div>
  </div>
  <script>
    const result = JSON.parse(sessionStorage.getItem('latestResult'));
    if (result) {
      document.getElementById('resultBox').innerHTML = `
        <strong>${result.name}</strong> (${result.roll})<br>
        Score: ${result.correct}/${result.total} (${result.score.toFixed(1)}%)<br>
        <span style="color: ${result.passed ? 'green' : 'red'}; font-weight: bold;">
          ${result.passed ? 'PASSED' : 'FAILED'}
        </span>
      `;
    } else {
      document.getElementById('resultBox').innerHTML = 'No result found.';
    }
  </script>
</body>
</html>
